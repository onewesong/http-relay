name: README star history

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/update-star-history.mjs
      - scripts/__tests__/update-star-history.test.mjs
      - .github/assets/star-history/**
      - .github/workflows/star-history.yml
      - README.md
      - README.zh-CN.md
  push:
    branches: [main]
    paths:
      - scripts/update-star-history.mjs
      - scripts/__tests__/update-star-history.test.mjs
      - .github/assets/star-history/history.json
      - .github/workflows/star-history.yml

permissions:
  contents: write

concurrency:
  group: http-relay-star-history
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --check scripts/update-star-history.mjs
      - run: node --test scripts/__tests__/update-star-history.test.mjs
  update:
    needs: verify
    if: github.repository == 'onewesong/http-relay' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate and publish complete star history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-star-history.mjs --refresh --publish --output "$RUNNER_TEMP/star-history"
