# SSE event-level response hooks use these bounds to avoid unbounded buffering.
[relay]
# Allow regular-mode targets resolving to private or local addresses.
# Keep false unless this deployment explicitly needs private targets.
allow_private_targets = false

[rewrite]
max_sse_event_bytes = 1048576
max_sse_events_per_response = 100000

[rewrite.http]
# External HTTP calls from JavaScript are disabled by default. When enabled,
# every target must exactly match one of these scheme/host/port origins.
enabled = false
allowed_origins = []
timeout = "1s"
max_timeout = "3s"
max_request_body_bytes = 1048576
max_response_body_bytes = 1048576
max_calls_per_hook = 3
follow_redirects = false
allow_private_networks = false

[rewrite.profiles.openai]
script = "builtin:rewrite.openai.js"
timeout = "500ms"
# 内置脚本已编入二进制，不支持热更新。
reload = "off"

[rewrite.profiles.rate-limit-529]
script = "builtin:rewrite.status-429-to-529.js"
timeout = "200ms"
reload = "off"

[rewrite.profiles.mock]
script = "./plugins/examples/rewrite.mock.js"
# timeout and reload are optional; omitted values inherit --script-timeout and
# --script-reload.

[rewrite.profiles.openai-compat]
script = "builtin:rewrite.chat-completions-to-responses.js"
timeout = "200ms"
reload = "watch"

[rewrite.profiles.anthropic-compat]
script = "builtin:rewrite.anthropic-messages-to-responses.js"
timeout = "200ms"
reload = "off"

[rewrite.profiles.anthropic-chat-compat]
script = "builtin:rewrite.anthropic-messages-to-chat-completions.js"
timeout = "200ms"
reload = "off"

[web]
# Maximum retained transactions for each namespace, including the default view.
max_transactions_per_namespace = 100

[web.mcp]
# Expose read-only capture tools at /mcp on the Web listener.
enabled = false

[web.auth]
mode = "jwt"

# Generate with `http-relay-auth secret`. Prefer WEB_AUTH_JWT_SECRET in
# deployments; uncomment this only when the file itself is protected by 0600.
# secret = "replace-with-an-unpadded-base64url-secret"

issuer = "http-relay"
audience = "http-relay-web"
token_ttl = "720h"
max_token_ttl = "2160h"
allow_permanent_tokens = false
admin_enabled = true
default_protected = true
fallback_protected = true
trust_forwarded_headers = false

[web.auth.namespaces]
team-a = true
team-b = true
public-demo = false
