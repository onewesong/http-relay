<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>http-relay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span class="brand">http-relay</span>
    <span id="meta" class="meta">connecting…</span>
    <nav id="view-switch" class="view-switch" aria-label="Traffic view">
      <button type="button" data-view="requests" class="active" aria-pressed="true">Requests</button>
      <button type="button" data-view="conversations" aria-pressed="false">Conversations</button>
    </nav>
    <span class="spacer"></span>
    <span id="status" class="conn conn-off" title="event stream">offline</span>
    <span id="count" class="count">0 reqs</span>
    <button id="clear" type="button" class="toolbar-button" disabled>Clear</button>
    <form id="logout" method="post" action="logout" hidden>
      <button type="submit">退出</button>
    </form>
  </header>

  <main>
    <section id="list" aria-label="requests"></section>
    <section id="detail" aria-label="detail">
      <div class="empty">Select a request to inspect it.</div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
